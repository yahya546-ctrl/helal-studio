<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><body style="margin:0;background:#111;color:#fff;font:20px Arial;text-align:center;padding-top:30px"><h2>Halloween Candy</h2><p>Score: <b id=s>0</b> | Time: <b id=t>20</b></p><div id=a style='position:relative;height:300px'></div><script>let s=0,t=20;const a=document.getElementById('a');function c(){a.innerHTML='';const e=document.createElement('span');e.textContent='🍬';e.style.cssText='position:absolute;font-size:44px;cursor:pointer;left:'+Math.random()*80+'%;top:'+Math.random()*80+'%';e.onclick=()=>{s++;document.getElementById('s').textContent=s;c()};a.append(e)}c();const i=setInterval(()=>{document.getElementById('t').textContent=--t;if(t<=0){clearInterval(i);a.innerHTML='Game over! Score: '+s}},1000)</script>
